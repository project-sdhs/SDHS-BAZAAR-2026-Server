name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR: 새 커밋을 올리면 이전 실행을 취소해요.
# main push: 취소하지 않고 커밋마다 끝까지 검사해요. (그룹을 커밋마다 따로 둬서 대기 중인 실행도 밀려나지 않아요)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .nvmrc(22)를 그대로 써요. check-latest: 러너에 캐시된 옛 버전 대신 항상 최신 22.x
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
