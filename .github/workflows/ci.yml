name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR: 새 커밋을 올리면 이전 실행을 취소해요.
# main push: 취소하지 않고 커밋마다 끝까지 검사해요. (그룹을 커밋마다 따로 둬서 대기 중인 실행도 밀려나지 않아요)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .nvmrc(22)를 그대로 써요. check-latest: 러너에 캐시된 옛 버전 대신 항상 최신 22.x
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    name: DB 테스트 (MySQL 8.0)
    runs-on: ubuntu-latest
    # 팀 서버와 같은 MySQL 8.0을 띄워서, 빈 DB에 마이그레이션 → 실제 DB 테스트까지 돌려요.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sdhs_bazaar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: sdhs_bazaar_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - run: npm ci
      # 빈 DB에 migrations/ 가 처음부터 끝까지 실행되는지 확인
      - run: npm run db:migrate
      - run: npm run test:db
